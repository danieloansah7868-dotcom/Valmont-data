<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071a38" stop-opacity=".98"/>
      <stop offset=".54" stop-color="#071a38" stop-opacity=".82"/>
      <stop offset="1" stop-color="#071a38" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071a38" stop-opacity="0"/>
      <stop offset=".45" stop-color="#071a38" stop-opacity=".8"/>
      <stop offset="1" stop-color="#05152f" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7900"/><stop offset="1" stop-color="#ffcf22"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>

  <image xlink:href="valmont-data-ad-background.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#shade)"/>
  <rect y="890" width="1080" height="460" fill="url(#bottom)"/>

  <!-- Brand -->
  <image xlink:href="valmont-data-logo.png" x="56" y="42" width="520" height="129" preserveAspectRatio="xMinYMid meet"/>

  <!-- Network badge -->
  <g transform="translate(60 205)" filter="url(#shadow)">
    <rect width="570" height="64" rx="32" fill="#ffcc00"/>
    <text x="285" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">MTN • TELECEL • AIRTELTIGO</text>
  </g>

  <!-- Main message -->
  <text x="60" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-3">FAST DATA.</text>
  <text x="60" y="435" font-family="DejaVu Sans, Arial, sans-serif" font-size="74" font-weight="700" fill="url(#gold)" letter-spacing="-3">ZERO STRESS.</text>
  <text x="63" y="485" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#dce6f5">SMART FEATURES THAT KEEP YOU CONNECTED</text>

  <!-- Feature cards -->
  <g font-family="DejaVu Sans, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(60 535)">
      <rect width="275" height="125" rx="22" fill="#ffffff" fill-opacity=".96"/>
      <circle cx="43" cy="42" r="23" fill="#ff8500"/>
      <text x="43" y="51" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">⚡</text>
      <text x="78" y="45" font-size="21" font-weight="700" fill="#081b3a">UNDER 60 SEC</text>
      <text x="25" y="92" font-size="20" fill="#657186">Very fast delivery</text>
    </g>
    <g transform="translate(355 535)">
      <rect width="310" height="125" rx="22" fill="#ffcc00"/>
      <circle cx="43" cy="42" r="23" fill="#081b3a"/>
      <text x="43" y="51" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">↻</text>
      <text x="78" y="45" font-size="27" font-weight="700" fill="#081b3a">AUTO-RELOAD</text>
      <text x="25" y="92" font-size="20" fill="#344052">Never run out again</text>
    </g>
    <g transform="translate(60 680)">
      <rect width="275" height="125" rx="22" fill="#ffffff" fill-opacity=".96"/>
      <circle cx="43" cy="42" r="23" fill="#ff8500"/>
      <text x="43" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">∞</text>
      <text x="78" y="45" font-size="27" font-weight="700" fill="#081b3a">NO EXPIRY</text>
      <text x="25" y="92" font-size="20" fill="#657186">Keep your unused data</text>
    </g>
    <g transform="translate(355 680)">
      <rect width="310" height="125" rx="22" fill="#ffffff" fill-opacity=".96"/>
      <circle cx="43" cy="42" r="23" fill="#ff8500"/>
      <text x="43" y="50" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">3</text>
      <text x="78" y="45" font-size="22" font-weight="700" fill="#081b3a">ALL NETWORKS</text>
      <text x="25" y="92" font-size="19" fill="#657186">MTN • Telecel • AirtelTigo</text>
    </g>
    <g transform="translate(60 825)">
      <rect width="605" height="105" rx="22" fill="#081b3a" fill-opacity=".93" stroke="#ffb000" stroke-width="3"/>
      <text x="28" y="45" font-size="27" font-weight="700" fill="#ffb000">SECURE MOBILE MONEY PAYMENTS</text>
      <text x="28" y="78" font-size="20" fill="#ffffff">Easy checkout • Automatic delivery • Order tracking</text>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(60 1035)" font-family="DejaVu Sans, Arial, sans-serif">
    <text x="0" y="0" font-size="27" font-weight="700" fill="#ffb000" letter-spacing="3">READY WHEN YOU ARE</text>
    <text x="0" y="70" font-size="56" font-weight="700" fill="#ffffff">ORDER YOUR BUNDLE NOW</text>
    <g transform="translate(0 105)">
      <rect width="500" height="78" rx="39" fill="url(#gold)"/>
      <circle cx="45" cy="39" r="23" fill="#ffffff"/>
      <text x="45" y="49" text-anchor="middle" font-size="25" font-weight="700" fill="#ef6c00">↗</text>
      <text x="82" y="51" font-size="32" font-weight="700" fill="#081b3a">valmontdata.com</text>
    </g>
    <text x="530" y="132" font-size="18" font-weight="700" fill="#ffb000">WHATSAPP SUPPORT</text>
    <text x="530" y="163" font-size="26" font-weight="700" fill="#ffffff">054 245 1578</text>
  </g>

  <text x="540" y="1320" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#aebbd0">Secure Mobile Money payment • Terms apply</text>
</svg>
