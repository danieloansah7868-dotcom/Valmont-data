<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Valmont Data</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1a38">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .brand-header {
      margin: 60px 0 30px;
      text-align: center;
    }
    .brand-header .logo {
      color: var(--orange);
      font-size: 28px;
      vertical-align: middle;
      margin-right: 8px;
    }
    .brand-header .title {
      font-size: 22px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.5px;
    }
    
    .signin-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      border: 1px solid var(--line-strong);
    }
    .signin-card h1 {
      color: var(--white);
      font-size: 24px;
      margin: 0 0 6px 0;
    }
    .signin-card .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      color: var(--soft);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .inp {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: rgba(0,0,0,0.2);
      color: var(--white);
      font-size: 15px;
      transition: var(--transition);
      font-family: inherit;
    }
    .inp:focus {
      outline: none;
      border-color: var(--orange);
      background: rgba(0,0,0,0.4);
    }
    
    .bottom-links {
      margin-top: 20px;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
    }
    .bottom-links a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 600;
    }
    .bottom-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="title" style="display:flex; justify-content:center; align-items:center; gap:10px;">
      <img src="assets/img/favicon.svg" alt="Logo" style="width:40px;height:40px;">
      <div style="text-align:left; font-size:22px; font-weight:800; color:var(--white);">Datamart<span style="color:var(--orange)">GH</span></div>
    </div>
  </div>

  <div class="signin-card">
    <h1>Welcome back</h1>
    <div class="sub">Sign in to your customer account</div>

    <form id="signinForm">
      <div class="field">
        <label for="siEmail">Email address</label>
        <input class="inp" type="email" id="siEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="siPass">Password</label>
        <input class="inp" type="password" id="siPass" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      
      <div id="signinErr"></div>
      
      <button class="btn btn-orange btn-block" type="submit" id="siSubmit" style="margin-top: 12px; padding: 14px; font-size:16px;">
        Sign In →
      </button>
    </form>

    <div class="bottom-links">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>
  </div>

  <script>
    document.getElementById("signinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("siSubmit");
      const errBox = document.getElementById("signinErr");
      
      btn.disabled = true;
      btn.textContent = "Signing in...";
      errBox.innerHTML = "";
      
      const payload = {
        email: document.getElementById("siEmail").value.trim(),
        password: document.getElementById("siPass").value
      };
      
      try {
        const res = await fetch("/api/auth/customer/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          errBox.innerHTML = `<div class="notice err" style="margin-bottom:12px;">${data.error || "Failed to sign in"}</div>`;
          btn.disabled = false;
          btn.textContent = "Sign In →";
          return;
        }
        
        // Save token and info
        localStorage.setItem("vd_customer_token", data.token);
        if (data.customer) {
          localStorage.setItem("vd_customer_info", JSON.stringify(data.customer));
        }
        
        // Redirect to homepage
        window.location.href = "dashboard.html";
        
      } catch (err) {
        errBox.innerHTML = `<div class="notice err" style="margin-bottom:12px;">Network error. Please try again.</div>`;
        btn.disabled = false;
        btn.textContent = "Sign In →";
      }
    });
  </script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
